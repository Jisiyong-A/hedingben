name: iOS build (simulator)

# 合订本 iOS 移植验证：macOS runner 上生成 Tauri iOS 工程 →
# 以 iOS 模拟器为目标编译（Rust aarch64-apple-ios-sim + Swift 壳 + 前端嵌入）。
# 模拟器构建不需要开发者证书；真机/上架需自行签名。
# 语义模型（265MB）不进 iOS 包 —— semantic search 暂用关键词回退。

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "app/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm ci

      # 只产出前端静态导出（跳过 265MB 语义模型同步，控制 iOS 包体积）
      - name: Build frontend (static export)
        run: npx next build --webpack

      - name: Ensure xcodegen available
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      # 中文 productName 在 xcodebuild -scheme 传参里有编码风险，CI 内临时换 ASCII
      - name: Normalize productName for Xcode
        run: node scripts/ios-product-name.cjs

      - name: Generate iOS project
        run: npx tauri ios init

      - name: Patch Info.plist (URL scheme / ATS / launch screen)
        run: node scripts/ios-info-plist.cjs

      # 用 tauri ios build（不是裸 xcodebuild）：Rust 代码编译发生在 Xcode 的
      # "Build Rust Code" phase 里，该 phase 需要连回外层 tauri CLI 守护进程
      # 获取编译选项（server-addr 文件）——直接跑 xcodebuild 没有这个守护
      # 进程会 panic。模拟器目标自动跳过代码签名。
      # --config 覆盖 beforeBuildCommand：前端已在上面单独构建（无语义模型），
      # 保持 .app 精简。
      - name: Build for iOS Simulator (tauri)
        run: |
          npx tauri ios build --target ios-aarch64-sim \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect simulator .app
        run: |
          mkdir -p dist-ios
          APP_PATH=$(find src-tauri/gen src-tauri/target -type d -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "no .app produced"; exit 1
          fi
          echo "found: $APP_PATH"
          ditto -rsrc "$APP_PATH" "dist-ios/$(basename "$APP_PATH")"

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: hedingben-ios-simulator-app
          path: dist-ios/
          if-no-files-found: error
